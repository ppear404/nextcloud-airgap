tls:
  certificates:
    - certFile: ../nextcloud/certs/nextcloud-dev.pem
      keyFile: ../nextcloud/certs/nextcloud-dev-key.pem
    - certFile: ../nextcloud/certs/talk-dev.lan.pem
      keyFile: ../nextcloud/certs/talk-dev.lan-key.pem
    - certFile: ../nextcloud/certs/collabora-dev.lan.pem
      keyFile: ../nextcloud/certs/collabora-dev.lan-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/traefik.pem
        keyFile: /etc/traefik/certs/traefik-key.pem
